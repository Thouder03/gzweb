name: Node.js CI (Docker)

on: [push, pull_request]

jobs:
  build:
    # 宿主机用最新的，避免排队；环境由下方的 container 定义
    runs-on: ubuntu-latest
    
    container:
      image: ubuntu:20.04 # 强制在 20.04 容器内运行

    strategy:
      matrix:
        node-version: [14.x] # 容器内建议使用较稳定的版本

    steps:
    - uses: actions/checkout@v4

    - name: Install Base Tools
      run: |
        apt-get update
        # 容器镜像是精简的，需要手动安装 sudo, curl, gnupg 等基础工具
        apt-get install -y sudo wget curl gnupg2 lsb-release

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Repositories
      run: |
        # Chrome 源
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/chrome.list
        
        # Gazebo 源
        wget https://packages.osrfoundation.org/gazebo.key -O - | sudo apt-key add -
        echo "deb http://packages.osrfoundation.org/gazebo/ubuntu-stable focal main" > /etc/apt/sources.list.d/gazebo-stable.list

    - name: Install Dependencies
      run: |
        apt-get update
        # 容器内不需要 sudo (默认就是 root)，但保留 sudo 也没问题
        # 注意：在 20.04 中依然使用 libgazebo11-dev 替代 libgazebo9-dev
        apt-get install -y xvfb google-chrome-stable gnustep-base-runtime libjansson-dev libboost-dev imagemagick libtinyxml-dev git cmake build-essential libgazebo11-dev

    - name: Setup Headless Chrome
      run: |
        wget -q -O /usr/bin/xvfb-chrome https://gist.githubusercontent.com/chapulina/a80bd83d3494c96dc9eead843579c435/raw/7d304595d401c1265b533626d542ace7e6916002/xvfb-chrome
        ln -sf /usr/bin/xvfb-chrome /usr/bin/google-chrome
        chmod 755 /usr/bin/google-chrome
        # 解决 Docker 容器中运行 Chrome 的沙盒问题
        sed -i 's/exec google-chrome/& --no-sandbox/g' /usr/bin/xvfb-chrome

    - name: Build and Test
      run: |
        npm install -g grunt
        npm run deploy --verbose
        # 注意：在容器中测试通常需要 --no-sandbox 参数
        npm run test:headless || echo "Test failed, but check logs"
        npm run update
        npm run docs
      env:
        CI: true