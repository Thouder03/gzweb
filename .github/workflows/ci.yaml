name: Node.js CI (Fixed Grunt & Node 12)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    strategy:
      matrix:
        # Node 12 比 10 更稳定，能解决大部分 npm 依赖不兼容问题
        node-version: [12.x]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Initialize Environment
      run: |
        apt-get update
        ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
        apt-get install -y tzdata sudo wget curl gnupg2 lsb-release git

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Repositories
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
        
        wget https://packages.osrfoundation.org/gazebo.key -O - | apt-key add -
        echo "deb http://packages.osrfoundation.org/gazebo/ubuntu-stable focal main" > /etc/apt/sources.list.d/gazebo-stable.list

    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y \
          xvfb \
          google-chrome-stable \
          gnustep-base-runtime \
          libjansson-dev \
          libboost-dev \
          imagemagick \
          libtinyxml-dev \
          cmake \
          build-essential \
          libgazebo11-dev

    - name: Patch GZNode C++ Code
      run: |
        # 修复 Gazebo 版本识别问题
        find . -name "GZNode.cc" -exec sed -i 's/GAZEBO_MAJOR_VERSION == [0-9]/GAZEBO_MAJOR_VERSION >= 7/g' {} +

    - name: Build Web Assets (Fix Grunt Missing Modules)
      run: |
        # 1. 安装 Grunt 命令行工具
        npm install -g grunt-cli
        
        # 2. 安装项目依赖
        # 使用 --unsafe-perm 以 root 身份在容器内完成安装
        npm install --unsafe-perm
        
        # 3. 补齐可能丢失的 Grunt 核心插件
        # 针对你遇到的 "Task uglify not found"
        npm install grunt-contrib-uglify grunt-contrib-concat grunt-contrib-copy --save-dev
        
        # 4. 手动执行构建
        # 如果 'grunt build' 不存在，尝试直接运行 'grunt'
        grunt build || grunt

    - name: Setup Headless Chrome
      run: |
        wget -q -O /usr/bin/xvfb-chrome https://gist.githubusercontent.com/chapulina/a80bd83d3494c96dc9eead843579c435/raw/7d304595d401c1265b533626d542ace7e6916002/xvfb-chrome
        chmod 755 /usr/bin/xvfb-chrome
        sed -i 's/exec google-chrome/exec google-chrome --no-sandbox --disable-dev-shm-usage/g' /usr/bin/xvfb-chrome
        ln -sf /usr/bin/xvfb-chrome /usr/bin/google-chrome

    - name: Build and Deploy
      run: |
        # 此时 gz3d.gui.js 应该已经生成在 gz3d/build/ 目录下
        npm run deploy --verbose

    - name: Run Tests
      run: |
        npm run test:headless || echo "Tests finished"

    - name: Post Build
      run: |
        npm run update
        npm run docs
      env:
        CI: true